name: Auto Release on Push

on:
  push:
    branches:
      - main
    paths:
      - 'assets/Documents/reborn_offline.py'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version tag
        id: version
        run: |
          # vYYMMDD.COMMIT_SHORT  e.g. v260911.2989c92
          DATE=$(date -u +%y%m%d)
          SHORT=$(git rev-parse --short HEAD)
          TAG="v${DATE}.${SHORT}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Generated tag: ${TAG}"

      - name: Extract release notes from commit message
        id: notes
        run: |
          # Use last commit message as release notes body
          BODY=$(git log -1 --pretty=format:"%B")
          echo "body<<NOTES_EOF" >> $GITHUB_OUTPUT
          echo "${BODY}" >> $GITHUB_OUTPUT
          echo "NOTES_EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Marvel Super War EN Mod ${{ steps.version.outputs.tag }}"
          body: |
            ## Installation · Instalasi
            
            1. Download `reborn_offline.py` below
            2. Copy to: `/sdcard/Android/data/com.netease.g104.cn/files/Netease/g104/Documents/reborn_offline.py`
            3. Launch Marvel Super War
            
            Full instructions → [INSTALL_EN.md](https://github.com/${{ github.repository }}/blob/main/INSTALL_EN.md) / [INSTALL_ID.md](https://github.com/${{ github.repository }}/blob/main/INSTALL_ID.md)
            
            ---
            
            **Changelog:**
            ${{ steps.notes.outputs.body }}
          files: |
            assets/Documents/reborn_offline.py
          draft: false
          prerelease: false
          make_latest: true
